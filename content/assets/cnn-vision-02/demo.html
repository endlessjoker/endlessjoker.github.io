<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从方向选择性到卷积核之间还有多远 · 实验</title><style>*{box-sizing:border-box}html{background:#faf9f5;color:#28362f}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:800px;margin:auto;padding:70px 28px 80px}h1{font-size:clamp(30px,5vw,44px);line-height:1.35;letter-spacing:-.03em;margin:18px 0 14px}h1+p{color:#64746a;font-size:15px;letter-spacing:.08em;margin-bottom:45px}h2{font-size:25px;line-height:1.5;margin:54px 0 20px}p,li{font-size:18px;line-height:1.95}p{margin:20px 0}strong{color:#174f3c}a{color:#286b55;text-decoration-thickness:1px;text-underline-offset:4px}img{max-width:100%;height:auto;display:block;margin:30px auto}em{font-style:normal;color:#6a746e;font-size:14px;line-height:1.7}pre{overflow-x:auto;background:#f0f2eb;padding:18px;border-radius:6px;font-size:14px;line-height:1.7}code{font-family:ui-monospace,monospace}table{border-collapse:collapse;width:100%;font-size:16px;margin:28px 0}th,td{padding:11px 16px;border-bottom:1px solid #d9dfd7}th{background:#edf1e9;text-align:left}.equation{overflow-x:auto;padding:28px 12px;margin:28px 0;background:#f0f2eb;border-radius:6px;font-size:21px}.inline-math{font-family:Georgia,serif;font-style:italic;white-space:nowrap}ol{padding-left:24px}ol li{font-size:14px;line-height:1.85;margin:15px 0;overflow-wrap:anywhere}.gray-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gray-bg{height:220px;display:grid;place-items:center}#dark{background:#333}#light{background:#ddd}.gray-bg span{width:80px;height:80px;background:#808080}.demo-controls{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:14px;font-size:13px;color:#637067}button{font:inherit;border:1px solid #9aa99a;background:#faf9f5;border-radius:5px;padding:9px 14px;cursor:pointer;color:#254936;white-space:nowrap}button:hover{background:#e5ecdf}.response-demo{padding:24px;background:#eef2e9;border:1px solid #dce3d6;border-radius:8px;margin:30px 0}.eyebrow{font-size:12px;letter-spacing:.06em;color:#66745e;margin-bottom:24px}.response-demo label{display:flex;justify-content:space-between;font-size:15px}.response-demo input{width:100%;margin:14px 0 22px;accent-color:#427859}.plots{display:grid;grid-template-columns:1fr 1fr;gap:20px}.plots svg{width:100%;height:auto}.plots h3{font-size:15px;font-weight:500;display:flex;justify-content:space-between}.plots h3 output{font-variant-numeric:tabular-nums;color:#a0472b}.hint{font-size:12px;line-height:1.7;color:#65715f;margin-bottom:0}footer{border-top:1px solid #d9dfd7;margin-top:50px;padding-top:20px;font-size:13px;color:#748074}@media(max-width:520px){main{padding:32px 20px 50px}p,li{font-size:17px}h2{font-size:23px}.gray-bg{height:155px}.gray-bg span{width:55px;height:55px}.demo-controls{align-items:flex-start}.plots{grid-template-columns:1fr}.response-demo{padding:17px}.equation{font-size:18px}th,td{padding:10px}h1+p{margin-bottom:32px}}@media print{main{padding:0;max-width:none}button,input{display:none}h2{break-after:avoid}.equation,.contrast-demo,.response-demo{break-inside:avoid}}select{font:inherit;background:#faf9f5;color:#28362f;border:1px solid #9dac94;border-radius:5px;padding:9px;margin:10px 0 22px;max-width:100%;display:block}.demo{border:1px solid #d9e0d2;background:#eef2e9;border-radius:8px;padding:24px;margin:30px 0}.demo label{font-size:15px;display:block}.demo input{width:100%;accent-color:#397052;margin:15px 0}.demo svg{width:100%;height:auto;display:block}.demo h3{font-size:15px;font-weight:500;margin-top:22px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:12px;text-align:center;margin-top:24px}.results strong{display:block;font-size:25px;line-height:1.8}.solid{color:#27694c}.dashed{color:#77679a}td,th{font-variant-numeric:tabular-nums}blockquote{border-left:3px solid #8aab85;padding-left:20px;margin-left:0}@media(max-width:520px){.demo{padding:14px}.results{gap:5px;font-size:11px}table{font-size:12px}td,th{padding:8px 5px}pre{font-size:12px}}main{padding:12px;max-width:800px}.demo,.response-demo{margin:8px 0}</style><main><section class="demo" aria-label="平移等变性演示"><div class="eyebrow">移动同一个信号，检查规则是否随位置改变</div><label for="mode">权重规则</label><select id="mode"><option value="shared">各位置共享</option><option value="local">前后半段使用相反的核</option></select><label for="offset">向右循环移动 <output id="offset-value">0</output> 格</label><input id="offset" type="range" min="0" max="15" value="0" step="1"><p id="rule" class="hint"></p><h3>输入与位置编号</h3><svg id="input-chart" viewBox="0 0 600 65" role="img" aria-label="平移后的输入信号"></svg><h3>两种计算顺序的输出</h3><svg id="output-chart" viewBox="0 0 600 195" role="img" aria-label="先移动再滤波，与先滤波再移动的比较"></svg><p class="hint"><span class="solid">实线：先移动，再处理</span>　<span class="dashed">虚线：先处理，再移动</span></p><div class="results" aria-live="polite"><div>最大等变误差<strong id="error">0</strong></div><div>全局最大值<strong id="maximum">2</strong></div><div>第 3 格读数<strong id="fixed">2</strong></div></div><p class="hint">首尾相接的人工网格；曲线连接离散计算结果，未插入额外采样。输出未整流。</p></section></main><script>const N=16, anchor=3;
function shift(a,d){return a.map((_,i)=>a[(i-d+N)%N]);}
function filter(a,shared){return a.map((_,i)=>{const s=shared||i<N/2?1:-1;return s*(-a[(i-1+N)%N]+2*a[i]-a[(i+1)%N]);});}
function experiment(d,shared){const original=Array(N).fill(0);original[anchor]=1;const input=shift(original,d);const expected=shift(filter(original,shared),d);const actual=filter(input,shared);return {input,expected,actual,error:Math.max(...actual.map((v,i)=>Math.abs(v-expected[i]))),maximum:Math.max(...actual),fixed:actual[anchor]};}
function draw(data,id){const by=id=>document.getElementById(id);let blocks='';data.input.forEach((v,i)=>{blocks+='<rect x="'+(20+i*35)+'" y="5" width="30" height="32" rx="3" fill="'+(v?'#b85032':'#e0e5da')+'"/><text x="'+(35+i*35)+'" y="57" text-anchor="middle" font-size="12" fill="#657064">'+i+'</text>'});by('input-chart').innerHTML=blocks;const path=a=>a.map((v,i)=>(i?'L':'M')+(35+i*35)+' '+(100-v*32)).join(' ');let chart='<path d="M20 36 H580 M20 100 H580 M20 164 H580" stroke="#d2dbcc"/><text x="4" y="40" font-size="12">2</text><text x="4" y="104" font-size="12">0</text><text x="0" y="168" font-size="12">−2</text>';chart+='<path d="'+path(data.expected)+'" fill="none" stroke="#7d73ac" stroke-width="5" stroke-dasharray="6 5" opacity=".7"/><path d="'+path(data.actual)+'" fill="none" stroke="#27694c" stroke-width="2.5"/>';by(id).innerHTML=chart;}
function update(){const by=id=>document.getElementById(id);const d=Number(by('offset').value),shared=by('mode').value==='shared',result=experiment(d,shared);by('offset-value').value=d;by('error').textContent=result.error;by('maximum').textContent=result.maximum;by('fixed').textContent=result.fixed;by('rule').textContent=shared?'所有位置使用 [−1, 2, −1]':'位置 0–7 使用 [−1, 2, −1]；位置 8–15 使用 [1, −2, 1]';draw(result,'output-chart');}
document.getElementById('offset').addEventListener('input',update);document.getElementById('mode').addEventListener('change',update);update();
</script></html>
