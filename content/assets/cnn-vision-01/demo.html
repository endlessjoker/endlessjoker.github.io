<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉为什么要压低自己的响应 · 实验</title><style>*{box-sizing:border-box}html{background:#faf9f5;color:#28362f}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:800px;margin:auto;padding:70px 28px 80px}h1{font-size:clamp(30px,5vw,44px);line-height:1.35;letter-spacing:-.03em;margin:18px 0 14px}h1+p{color:#64746a;font-size:15px;letter-spacing:.08em;margin-bottom:45px}h2{font-size:25px;line-height:1.5;margin:54px 0 20px}p,li{font-size:18px;line-height:1.95}p{margin:20px 0}strong{color:#174f3c}a{color:#286b55;text-decoration-thickness:1px;text-underline-offset:4px}img{max-width:100%;height:auto;display:block;margin:30px auto}em{font-style:normal;color:#6a746e;font-size:14px;line-height:1.7}pre{overflow-x:auto;background:#f0f2eb;padding:18px;border-radius:6px;font-size:14px;line-height:1.7}code{font-family:ui-monospace,monospace}table{border-collapse:collapse;width:100%;font-size:16px;margin:28px 0}th,td{padding:11px 16px;border-bottom:1px solid #d9dfd7}th{background:#edf1e9;text-align:left}.equation{overflow-x:auto;padding:28px 12px;margin:28px 0;background:#f0f2eb;border-radius:6px;font-size:21px}.inline-math{font-family:Georgia,serif;font-style:italic;white-space:nowrap}ol{padding-left:24px}ol li{font-size:14px;line-height:1.85;margin:15px 0;overflow-wrap:anywhere}.gray-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gray-bg{height:220px;display:grid;place-items:center}#dark{background:#333}#light{background:#ddd}.gray-bg span{width:80px;height:80px;background:#808080}.demo-controls{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:14px;font-size:13px;color:#637067}button{font:inherit;border:1px solid #9aa99a;background:#faf9f5;border-radius:5px;padding:9px 14px;cursor:pointer;color:#254936;white-space:nowrap}button:hover{background:#e5ecdf}.response-demo{padding:24px;background:#eef2e9;border:1px solid #dce3d6;border-radius:8px;margin:30px 0}.eyebrow{font-size:12px;letter-spacing:.06em;color:#66745e;margin-bottom:24px}.response-demo label{display:flex;justify-content:space-between;font-size:15px}.response-demo input{width:100%;margin:14px 0 22px;accent-color:#427859}.plots{display:grid;grid-template-columns:1fr 1fr;gap:20px}.plots svg{width:100%;height:auto}.plots h3{font-size:15px;font-weight:500;display:flex;justify-content:space-between}.plots h3 output{font-variant-numeric:tabular-nums;color:#a0472b}.hint{font-size:12px;line-height:1.7;color:#65715f;margin-bottom:0}footer{border-top:1px solid #d9dfd7;margin-top:50px;padding-top:20px;font-size:13px;color:#748074}@media(max-width:520px){main{padding:32px 20px 50px}p,li{font-size:17px}h2{font-size:23px}.gray-bg{height:155px}.gray-bg span{width:55px;height:55px}.demo-controls{align-items:flex-start}.plots{grid-template-columns:1fr}.response-demo{padding:17px}.equation{font-size:18px}th,td{padding:10px}h1+p{margin-bottom:32px}}@media print{main{padding:0;max-width:none}button,input{display:none}h2{break-after:avoid}.equation,.contrast-demo,.response-demo{break-inside:avoid}}main{padding:12px;max-width:800px}.demo,.response-demo{margin:8px 0}</style><main><div class="contrast-demo"><div class="gray-pair"><div class="gray-bg" id="dark"><span></span></div><div class="gray-bg" id="light"><span></span></div></div><div class="demo-controls"><span>两个方块始终都是 RGB(128, 128, 128)</span><button id="same" aria-pressed="false">统一背景</button></div></div><section class="response-demo" aria-label="减法与除法模型交互演示"><div class="eyebrow">动手试一试 · 教学模型，非神经记录</div><label for="drive">驱动 E <output id="ev">3.0</output></label><input id="drive" type="range" min="0" max="6" step="0.1" value="3"><label for="mask">另一种刺激 M <output id="mv">0.0</output></label><input id="mask" type="range" min="0" max="6" step="0.1" value="0"><div class="plots"><div><h3>减法模型 <output id="subval"></output></h3><svg id="subchart" viewBox="0 0 300 200" role="img" aria-label="减法模型响应曲线"></svg></div><div><h3>除法模型 <output id="divval"></output></h3><svg id="divchart" viewBox="0 0 300 200" role="img" aria-label="除法模型响应曲线"></svg></div></div><p class="hint">曲线：固定当前 M，扫描 E。圆点：当前 E 对应的输出。两图纵轴尺度不同。</p></section></main><script>const by=id=>document.getElementById(id);let unified=false;by('same').onclick=()=>{unified=!unified;by('dark').style.background=unified?'#aaa':'#333';by('light').style.background=unified?'#aaa':'#ddd';by('same').textContent=unified?'恢复不同背景':'统一背景';by('same').setAttribute('aria-pressed',String(unified))};function chart(id,fn,max,E){let p='';for(let i=0;i<=120;i++){let x=i/20;p+=(i?' L':'M')+(36+x/6*248).toFixed(2)+' '+(164-fn(x)/max*140).toFixed(2)}by(id).innerHTML='<path d="M36 20 V164 H288" fill="none" stroke="#a0ada0"/><text x="25" y="168" font-size="12" text-anchor="end">0</text><text x="25" y="28" font-size="12" text-anchor="end">'+max+'</text><text x="37" y="186" font-size="12">0</text><text x="275" y="186" font-size="12">6</text><text x="151" y="190" font-size="12">E</text><path d="'+p+'" fill="none" stroke="#427859" stroke-width="2.5"/><circle cx="'+(36+E/6*248)+'" cy="'+(164-fn(E)/max*140)+'" r="5" fill="#b85032"/>'}function update(){const E=Number(by('drive').value),M=Number(by('mask').value),sub=x=>Math.max(0,x-M),div=x=>x*x/(1+x*x+M*M);by('ev').value=E.toFixed(1);by('mv').value=M.toFixed(1);by('subval').value=sub(E).toFixed(3);by('divval').value=div(E).toFixed(3);chart('subchart',sub,6,E);chart('divchart',div,1,E)}by('drive').oninput=update;by('mask').oninput=update;update();</script></html>
